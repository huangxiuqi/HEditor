<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 空 favicon：不然浏览器会去要 /favicon.ico 并回一个 404，那条 console error 会被
     探针的"无 console 错误"判据抓住（单线程宿主那边 index.html 也有同样一行）。 -->
<link rel="icon" href="data:,">
<title>HEditor · 引擎在 Worker 里</title>
<style>
  html, body { margin: 0; height: 100%; background: #f2f3f5; color: #1d1d1f;
               font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  /* 纵向弹性布局：工具条占它自己需要的高度，剩下的全给滚动区。
     为什么不写 height: calc(100% - 74px)：74 是个魔数，工具条一换行（项目多了、
     窗口窄了）它就失配 —— 内容比视口高一截，页面因此长出一条外层滚动条，
     而那条滚动条一动，里外两个滚动区就开始互相打架。 */
  body { display: flex; flex-direction: column; }
  #bar { padding: 8px 14px; background: #1f2937; color: #e5e7eb; flex: 0 0 auto; }
  #bar.err { background: #7f1d1d; }
  #tools { padding: 6px 14px; background: #e5e7eb; display: flex; gap: 8px;
           align-items: center; flex-wrap: wrap; border-bottom: 1px solid #d1d5db;
           flex: 0 0 auto; }
  #tools label { color: #4b5563; }
  #tools select, #tools input, #tools button { font: inherit; padding: 2px 6px;
           border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
  #tools button { cursor: pointer; }
  /* min-height: 0 是必须的：弹性项的默认最小高度是"内容高度"，不写它，滚动区
     会被内容撑高而不是自己滚 —— 表现就是整页一条外层滚动条。 */
  #wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #stage { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: #e9eaec; }
  /* 一页一张画布：位置与尺寸由宿主按 Worker 推来的几何摆（见 syncPageCanvases） */
  .pg { display: block; }
  #spacer { position: absolute; top: 0; left: 0; width: 1px; }
  /* 页画布的容器：高度等于滚动内容的高度（分页 = 页数 x 步距 - 间隙，连页 = 内容底边），
     overflow: hidden 把最后一页多出来的那一截裁掉 —— 连页下没有页间隙，若让画布自己
     撑高，滚动条会多出一整页的空白。位置与高度由 syncSpacer / syncPageCanvases 给。 */
  #pages { position: absolute; top: 0; left: 0; overflow: hidden; }
  /* overflow: hidden 是必须的：这一层装着跟随光标的输入法框（它被撑成"从光标到页右缘"
     那么宽、位置跟着光标走）。光标滚到视口之外时那个框会落到视口外面，而这一层不裁剪的话
     它就顶出 body、整页长出一条外层滚动条（点一下让光标回到视口内，滚动条又消失）。
     单线程宿主那边不存在这个问题：它的 #ime 挂在 #stage 里，天然被滚动容器裁掉。 */
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  /* ★ pointer-events 必须是 none（与单线程宿主 index.html 的 #ime 一致）：
     它被撑成"从光标到页右缘"那么宽去承接输入法与候选窗定位，若允许吃指针，
     光标那一行的整条横带都点不进画布 —— 点击落在 textarea 上，命中测试永远不跑。 */
  #ime { position: absolute; pointer-events: none; border: 0; outline: 0; padding: 0;
         background: transparent; color: transparent; caret-color: transparent;
         resize: none; overflow: hidden; white-space: pre; }
  #panel { position: absolute; right: 10px; top: 10px; width: 320px;
           background: rgba(255,255,255,.94); border: 1px solid #d7dade;
           border-radius: 8px; padding: 10px 12px; }
  #panel h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; }
  #stats { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  #stats dt { color: #6b7280; }
  #stats dd { margin: 0; }
</style>
</head>
<body>
  <div id="bar">启动中…</div>
  <div id="tools">
    <label>场景</label>
    <select id="scenario">
      <option value="0">完整样例</option>
      <option value="1">蒙文竖排 vertical-lr</option>
      <option value="2">中文竖排 vertical-rl</option>
      <option value="3">中文长文本</option>
      <option value="4">中英混排 + 回退</option>
      <option value="5">蒙文竖排对照</option>
      <option value="6" selected>可编辑（敲字 / 光标）</option>
      <option value="7">长文档 2000 段</option>
      <option value="8">真病历样例</option>
      <option value="9">行内原子：图片 / 公式</option>
      <option value="10">表格（格线 / 合并格 / 行高）</option>
    </select>
    <label>缩放</label>
    <!-- 倍数：1 = 100% = 96 dpi。引擎收的是"设备像素 / 磅"，换算在 zoomToFactor 里做。 -->
    <input id="zoom" type="number" step="0.0625" min="0.375" max="3" value="1" style="width:96px">
    <label>光标</label>
    <input id="caretColor" type="color">
    <input id="caretWidth" type="number" min="0.4" max="8" step="0.2" style="width:64px"
           title="宽度（磅）">
    <label>选区</label>
    <input id="selColor" type="color">
    <input id="selAlpha" type="number" min="0" max="255" step="5" style="width:64px"
           title="不透明度 0~255">
    <label>模式</label>
    <select id="mode">
      <option value="0" selected>文档</option>
      <option value="1">表单</option>
      <option value="2">只读</option>
    </select>
    <label>视图</label>
    <select id="viewMode">
      <option value="paged" selected>分页</option>
      <option value="continuous">连页</option>
    </select>
    <button id="btnPlus">表单样例</button>
    <button id="btnUndo">撤销</button>
    <button id="btnRedo">重做</button>
    <button id="btnSelf">自检</button>
    <!-- 保存 / 打开：文件就是引擎给的 JSON 文本，宿主不解析也不改写。
         openFile 藏起来，由"打开…"代点 —— 原生 file 控件的样式改不动。 -->
    <button id="btnSave">保存</button>
    <button id="btnOpen">打开…</button>
    <input id="openFile" type="file" accept=".json,application/json" hidden>
    <span id="status">就绪</span>
  </div>
  <div id="wrap">
    <div id="stage"><div id="spacer"></div><div id="pages"></div></div>
    <div id="overlay"><textarea id="ime" rows="1" spellcheck="false"></textarea></div>
    <div id="panel">
      <h3>引擎在 Worker 里（主线程不参与排版与上屏）</h3>
      <dl id="stats"></dl>
    </div>
  </div>
  <script src="host_error.js"></script>
  <script src="drag_select.js"></script>
  <!-- 两宿主共用的输入层：必须在 worker_host.js 之前（它一加载就取这里的工厂）。 -->
  <script src="host_core.js"></script>
  <!-- WebAssembly SIMD 能力探测：与另两张页同一份，必须在主脚本之前。 -->
  <script src="wasm_feature.js"></script>
  <script src="worker_host.js"></script>
  <script>
    // 工具条：只把命令发过去，不等结果 —— 这就是"交互路径零 await"的形态。
    (function () {
      const h = () => window.__wheditor;
      const q = (id) => document.getElementById(id);
      q('scenario').addEventListener('change', (e) => {
        const id = Number(e.target.value);
        // 缩放从门面读（密度），不从输入框读 —— 输入框那一格是倍数，两者差 4 / 3。
        if (id === 8) h().loadMedicalSample(1); else h().run(id, h().zoomLevel);
      });
      q('zoom').addEventListener('change', (e) => h().zoomToFactor(Number(e.target.value)));
      // 视图模式：分页（一页一张画布）与连页（一个视口画布）。切换要重来一遍画布，
      //   所以走门面而不是改一条消息 —— 那里同时管着页间隙（连页 0 / 分页 14 磅）。
      q('viewMode').addEventListener('change', (e) => h().setViewMode(e.target.value));
      // 光标与选区的样式。初值从推过来的 state 里读（默认值只在 EngineConfig 里有一份），
      //   读到之前控件的值是空的，所以那时按下的 input 一律丢掉 —— 否则第一次触摸会把
      //   颜色写成取色器的空值黑。这条路上每一拍只有一次 present：样式参数不作废底图，
      //   见 setCaretAndSelectionStyle。
      (function () {
        const hex = (c) => '#' + c.slice(0, 3).map((v) => v.toString(16).padStart(2, '0')).join('');
        const rgb = (v) => [1, 3, 5].map((i) => parseInt(v.slice(i, i + 2), 16));
        let live = false;
        const pushCaret = () => {
          if (!live) return;
          const c = rgb(q('caretColor').value);
          h().setCaretStyle({ color: [...c, 255], widthPt: Number(q('caretWidth').value) });
        };
        const pushSel = () => {
          if (!live) return;
          const c = rgb(q('selColor').value);
          h().setSelectionStyle({ color: [...c, Number(q('selAlpha').value)] });
        };
        for (const [id, fn] of [['caretColor', pushCaret], ['caretWidth', pushCaret],
                                ['selColor', pushSel], ['selAlpha', pushSel]]) {
          q(id).addEventListener('input', fn);
        }
        const t = setInterval(() => {
          const cs = h().caretStyle;
          const ss = h().selectionStyle;
          if (!cs || !ss) return;
          clearInterval(t);
          q('caretColor').value = hex(cs.color);
          q('caretWidth').value = String(cs.widthPt);
          q('selColor').value = hex(ss.color);
          q('selAlpha').value = String(ss.color[3]);
          live = true;
        }, 100);
      })();
      q('mode').addEventListener('change', (e) => h().setEditMode(Number(e.target.value)));
      q('btnPlus').addEventListener('click', () => h().loadFormSample(0));
      q('btnUndo').addEventListener('click', () => h().undo());
      q('btnRedo').addEventListener('click', () => h().redo());
      q('btnSelf').addEventListener('click', async () => {
        const r = await h().selfCheck();
        window.__lastSelfCheck = r;
        q('bar').textContent =
          `自检：画布与帧不同 ${r.diff} px / 共 ${r.compared}（比例 ${r.ratio.toFixed(6)}）`;
      });

      // 保存 / 打开。与单线程宿主那一对按钮同一套动作，差别只有 await ——
      //   引擎在 Worker 那侧，两件事都要走一次往返。
      q('btnSave').addEventListener('click', async () => {
        try {
          const text = await h().saveDocument();
          if (!text) { q('status').textContent = '还没有装载文档，没东西可保存'; return; }
          const d = new Date();
          const p = (n) => String(n).padStart(2, '0');
          const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-` +
                        `${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
          const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
          const a = document.createElement('a');
          a.href = url;
          a.download = `heditor-${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          q('status').textContent = `已保存 ${(text.length / 1024).toFixed(1)} KB`;
        } catch (e) {
          q('status').textContent = `保存失败：${(e && e.message) || e}`;
        }
      });
      q('btnOpen').addEventListener('click', () => q('openFile').click());
      q('openFile').addEventListener('change', async () => {
        const f = q('openFile').files && q('openFile').files[0];
        q('openFile').value = '';   // 同一个文件连开两次也要触发 change
        if (!f) return;
        try {
          const text = await f.text();
          await h().loadDocument(text);
          q('status').textContent =
            `已打开 ${f.name}（${(text.length / 1024).toFixed(1)} KB）`;
        } catch (e) {
          // 引擎解析失败时一个字节都没动，这里只把原因显示出来。
          q('status').textContent = `打开失败：${(e && e.message) || e}`;
        }
      });
    })();
  </script>
</body>
</html>
